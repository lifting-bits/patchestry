apiVersion: patchestry.io/v1
metadata:
  name: serial-qemu-pointer-patch
  description: Replace qemu_target_pointer inside the QEMU serial firmware fixture
  version: 1.0.0
  author: Patchestry
  created: '2026-11-16'
  kind: PatchSpec
target:
  binary: serial.elf
  arch: ARM:LE:32
libraries:
- patches/serial_qemu_patch_library.yaml
patches:
- name: serial_qemu_pointer_patch
  id: QEMU-SERIAL-POINTER-001
  description: Replace emit_pointer_base inside qemu_target_pointer
  match:
    name: emit_pointer_base
    kind: function
    context:
    - qemu_target_pointer
  action:
    mode: replace
    patch: serial_qemu_pointer_patch
    arguments: []
