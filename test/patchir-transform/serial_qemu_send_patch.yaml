apiVersion: patchestry.io/v1
metadata:
  name: serial-qemu-send-patch
  description: Check the byte at the entry of qemu_target_send and call the reject handler for a lower-case letter or above
  version: 1.0.0
  author: Patchestry
  created: '2026-11-16'
  kind: PatchSpec
target:
  binary: serial.elf
  arch: ARM:LE:32
libraries:
- patches/serial_qemu_patch_library.yaml
patches:
- name: serial_qemu_send_patch
  id: QEMU-SERIAL-SEND-001
  description: Reject a byte outside the accepted range by calling a handler that does not return
  match:
    name: qemu_irq_disable
    kind: function
    context:
    - qemu_target_send
  action:
    mode: apply_at_entrypoint
    patch: serial_qemu_send_patch
    arguments:
    - name: byte
      source: operand
      index: 0
