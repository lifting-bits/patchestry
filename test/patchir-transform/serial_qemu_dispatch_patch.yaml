apiVersion: patchestry.io/v1
metadata:
  name: serial-qemu-dispatch-patch
  description: Insert behavior before qemu_target_dispatch calls emit_dispatch_base
  version: 1.0.0
  author: Patchestry
  created: '2026-11-16'
  kind: PatchSpec
target:
  binary: serial.elf
  arch: ARM:LE:32
libraries:
- patches/serial_qemu_patch_library.yaml
patches:
- name: serial_qemu_dispatch_patch
  id: QEMU-SERIAL-DISPATCH-001
  description: Insert output before emit_dispatch_base in qemu_target_dispatch
  match:
    name: emit_dispatch_base
    kind: function
    context:
    - qemu_target_dispatch
  action:
    mode: apply_before
    patch: serial_qemu_dispatch_patch
    arguments: []
