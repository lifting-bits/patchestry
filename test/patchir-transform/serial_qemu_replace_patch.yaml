apiVersion: patchestry.io/v1
metadata:
  name: serial-qemu-replace-patch
  description: Replace qemu_target_replace inside the QEMU serial firmware fixture
  version: 1.0.0
  author: Codex
  created: '2026-04-22'
  kind: PatchSpec
target:
  binary: serial.elf
  arch: ARM:LE:32
libraries:
- patches/serial_qemu_patch_library.yaml
patches:
- name: serial_qemu_replace_patch
  id: QEMU-SERIAL-REPLACE-001
  description: Replace emit_replace_base inside qemu_target_replace
  match:
    name: emit_replace_base
    kind: function
    context:
    - qemu_target_replace
  action:
    mode: replace
    patch: serial_qemu_replace_patch
    arguments: []
