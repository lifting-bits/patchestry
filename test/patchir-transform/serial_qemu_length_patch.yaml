apiVersion: patchestry.io/v1
metadata:
  name: serial-qemu-length-patch
  description: Replace the body of qemu_target_length with one that rejects a length over 16 by early return
  version: 1.0.0
  author: Patchestry
  created: '2026-11-16'
  kind: PatchSpec
target:
  binary: serial.elf
  arch: ARM:LE:32
libraries:
- patches/serial_qemu_patch_library.yaml
patches:
- name: serial_qemu_length_patch
  id: QEMU-SERIAL-LENGTH-001
  description: Reject a length over the limit by returning the error value
  match:
    name: qemu_target_length
    kind: function
  action:
    mode: replace_definition
    patch: serial_qemu_length_patch
