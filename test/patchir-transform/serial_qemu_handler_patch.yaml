apiVersion: patchestry.io/v1
metadata:
  name: serial-qemu-handler-patch
  description: Replace qemu_target_handler inside the QEMU serial firmware fixture
  version: 1.0.0
  author: Patchestry
  created: '2026-11-16'
  kind: PatchSpec
target:
  binary: serial.elf
  arch: ARM:LE:32
libraries:
- patches/serial_qemu_patch_library.yaml
patches:
- name: serial_qemu_handler_patch
  id: QEMU-SERIAL-HANDLER-001
  description: Replace emit_handler_base inside qemu_target_handler
  match:
    name: emit_handler_base
    kind: function
    context:
    - qemu_target_handler
  action:
    mode: replace
    patch: serial_qemu_handler_patch
    arguments: []
