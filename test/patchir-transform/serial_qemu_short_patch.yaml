apiVersion: patchestry.io/v1
metadata:
  name: serial-qemu-short-patch
  description: Replace qemu_target_short inside the QEMU serial firmware fixture
  version: 1.0.0
  author: Patchestry
  created: '2026-11-16'
  kind: PatchSpec
target:
  binary: serial.elf
  arch: ARM:LE:32
libraries:
- patches/serial_qemu_patch_library.yaml
patches:
- name: serial_qemu_short_patch
  id: QEMU-SERIAL-SHORT-001
  description: Replace emit_short_base inside qemu_target_short
  match:
    name: emit_short_base
    kind: function
    context:
    - qemu_target_short
  action:
    mode: replace
    patch: serial_qemu_short_patch
    arguments: []
