apiVersion: patchestry.io/v1
metadata:
  name: serial-qemu-patch-library
  description: Patch and contract library for the in-repo QEMU serial firmware fixture
  version: 1.0.0
  author: Codex
  created: '2026-04-22'
  kind: PatchLibrary
patch_definitions:
- name: serial_qemu_before_patch
  description: Emit a line before qemu_target_before runs
  category: serial-qemu
  function_name: patch::before::qemu_target_before
  code_file: serial_qemu_patch.c
- name: serial_qemu_after_patch
  description: Emit a line after qemu_target_after runs
  category: serial-qemu
  function_name: patch::after::qemu_target_after
  code_file: serial_qemu_patch.c
- name: serial_qemu_replace_patch
  description: Replace qemu_target_replace with a patched variant
  category: serial-qemu
  function_name: patch::replace::qemu_target_replace
  code_file: serial_qemu_patch.c
- name: serial_qemu_entry_contract
  description: Emit a visible runtime contract line at function entry
  category: serial-qemu
  function_name: contract::entrypoint::qemu_target_contract
  code_file: serial_qemu_patch.c
- name: serial_qemu_short_patch
  description: Replace the body of qemu_target_short, a 4-byte function
  category: serial-qemu
  function_name: patch::replace::qemu_target_short
  code_file: serial_qemu_patch.c
- name: serial_qemu_tiny_patch
  description: Replace the body of qemu_target_tiny, a 2-byte function
  category: serial-qemu
  function_name: patch::replace::qemu_target_tiny
  code_file: serial_qemu_patch.c
- name: serial_qemu_pointer_patch
  description: Replace the body of qemu_target_pointer, a function called through a stored address
  category: serial-qemu
  function_name: patch::replace::qemu_target_pointer
  code_file: serial_qemu_patch.c
- name: serial_qemu_handler_patch
  description: Replace the body of qemu_target_handler, which is called through qemu_callback
  category: serial-qemu
  function_name: patch::replace::qemu_target_handler
  code_file: serial_qemu_patch.c
- name: serial_qemu_dispatch_patch
  description: Emit a line before qemu_target_dispatch, which makes an indirect call
  category: serial-qemu
  function_name: patch::before::qemu_target_dispatch
  code_file: serial_qemu_patch.c
- name: serial_qemu_switch_patch
  description: Replace qemu_target_replace with a switch over new string constants
  category: serial-qemu
  function_name: patch::replace::switch
  code_file: serial_qemu_patch.c
- name: serial_qemu_divide_patch
  description: Replace qemu_target_replace with a 64-bit division, which needs a compiler runtime helper
  category: serial-qemu
  function_name: patch::replace::divide
  code_file: serial_qemu_patch.c
- name: serial_qemu_state_patch
  description: Replace qemu_target_replace with code that keeps a writable variable of its own
  category: serial-qemu
  function_name: patch::replace::state
  code_file: serial_qemu_patch.c
- name: serial_qemu_initialized_patch
  description: Replace qemu_target_replace with code that keeps an initialized writable variable of its own
  category: serial-qemu
  function_name: patch::replace::initialized
  code_file: serial_qemu_patch.c
- name: serial_qemu_length_patch
  description: Replacement body for qemu_target_length that rejects a length over 16 by early return
  category: serial-qemu
  function_name: patch::definition::qemu_target_length
  code_file: serial_qemu_patch.c
- name: serial_qemu_forward_patch
  description: Guarded forward_second call that is skipped for a value over 32
  category: serial-qemu
  function_name: patch::replace::forward_second
  code_file: serial_qemu_patch.c
- name: serial_qemu_send_patch
  description: Entry check for qemu_target_send that calls the reject handler
  category: serial-qemu
  function_name: patch::entry::qemu_target_send
  code_file: serial_qemu_patch.c
