apiVersion: patchestry.io/v1
metadata:
  name: replace-definition-with-captures-reject
  kind: PatchSpec
target:
  binary: x.bin
  arch: ARM:LE:32
libraries:
- patches/measurement_update_patch.yaml
patches:
- name: bogus_replace_definition_with_captures
  id: REPLACE-DEF-CAPTURES-REJECT-001
